<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pune Explorer — Almost there</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F4C42}a:hover{color:#0A3730}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
@keyframes popin{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) .1s both}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.25s}.d4{animation-delay:.32s}.d5{animation-delay:.39s}.d6{animation-delay:.46s}
.rings{animation:spin 90s linear infinite;transform-origin:50% 50%}
.badge{animation:popin .6s cubic-bezier(.2,.7,.2,1) .2s both}
.tick{stroke-dasharray:30;animation:draw .5s ease-out .6s both}
.field{transition:border-color .3s,box-shadow .3s}
.field:focus-within{border-color:#0F4C42;box-shadow:0 0 0 3px rgba(15,76,66,.12)}
.box{transition:background-color .25s,border-color .25s}
.cta{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .35s,background-color .35s}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 30px -14px rgba(15,76,66,.7)}
.cta:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0F4C42; font-family: 'Hanken Grotesk', sans-serif; color: #111614">

  <svg class="rings" width="440" height="440" viewBox="0 0 440 440" aria-hidden="true" style="position: absolute; right: -170px; top: -150px; opacity: 0.16"><circle cx="220" cy="220" r="80" fill="none" stroke="#F6F6F3"></circle><circle cx="220" cy="220" r="130" fill="none" stroke="#F6F6F3" stroke-dasharray="2 6"></circle><circle cx="220" cy="220" r="180" fill="none" stroke="#F6F6F3"></circle><circle cx="220" cy="220" r="215" fill="none" stroke="#F6F6F3" stroke-dasharray="1 9"></circle></svg>

  <div style="position: absolute; top: 64px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 22px; color: #F6F6F3">
    <div class="badge" style="width: 52px; height: 52px; border-radius: 26px; background: #F6F6F3; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F4C42" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path class="tick" d="M5 12l5 5 9-10"></path></svg>
    </div>
    <div class="rise d2" style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-size: 46px; font-weight: 400; line-height: 0.95">Almost <span style="font-style: italic; color: #A9CFC6">there</span></h1>
      <div style="font-size: 14px; color: #CFE3DE">+91 98••• ••210 is verified. This number is new, so let's set up your account.</div>
    </div>
  </div>

  <div class="up" style="position: absolute; left: 0; right: 0; top: 280px; bottom: 0; background: #F6F6F3; border-radius: 30px 30px 0 0; padding: 30px 24px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

    <label class="rise d3" style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #5E6763">WHAT SHOULD WE CALL YOU?</span>
      <span class="field" style="height: 50px; border-radius: 14px; border: 1px solid #DDE1DD; background: #FFFFFF; display: flex; align-items: center; padding: 0 16px"><input placeholder="Your name" autocomplete="name" style="border: none; outline: none; flex: 1; min-width: 0; font-family: 'Hanken Grotesk', sans-serif; font-size: 15px; background: transparent; color: #111614"></span>
    </label>

    <label class="rise d4" style="display: flex; flex-direction: column; gap: 6px">
      <span style="display: flex; justify-content: space-between"><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #5E6763">EMAIL</span><span style="font-size: 12px; color: #5E6763">Optional</span></span>
      <span class="field" style="height: 50px; border-radius: 14px; border: 1px solid #DDE1DD; background: #FFFFFF; display: flex; align-items: center; padding: 0 16px"><input type="email" placeholder="For trip summaries and account recovery" autocomplete="email" style="border: none; outline: none; flex: 1; min-width: 0; font-family: 'Hanken Grotesk', sans-serif; font-size: 14.5px; background: transparent; color: #111614"></span>
    </label>

    <button class="rise d5" onClick="{{toggleAgree}}" role="checkbox" aria-checked="{{agreeChecked}}" style="display: flex; align-items: flex-start; gap: 10px; border: none; background: transparent; padding: 0; text-align: left; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif">
      <span class="box" style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid {{boxBd}}; background: {{boxBg}}; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 1px">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F6F6F3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
      <span style="font-size: 13px; line-height: 1.45; color: #5E6763">I agree to the <span style="color: #0F4C42; font-weight: 600">Terms</span> and <span style="color: #0F4C42; font-weight: 600">Privacy Policy</span></span>
    </button>

    <a class="rise d5 cta" href="Onboard.dc.html" aria-disabled="{{ctaDisabled}}" style="height: 56px; border-radius: 28px; background: {{ctaBg}}; color: #F6F6F3; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; text-decoration: none; margin-top: 4px">Continue
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>

    <div class="rise d6" style="margin-top: auto; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: #E8F0ED">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F4C42" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"></path><path d="M9 12l2 2 4-4"></path></svg>
      <div style="font-size: 12.5px; line-height: 1.45; color: #1E3D37">Next, we'll ask for one emergency contact. It takes 20 seconds and makes SOS work from day one.</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { agree: false };
  }
  renderVals() {
    const agree = this.state.agree;
    return {
      agreeChecked: agree ? 'true' : 'false',
      boxBg: agree ? '#0F4C42' : '#FFFFFF',
      boxBd: agree ? '#0F4C42' : '#B9C1BD',
      toggleAgree: () => this.setState({ agree: !agree }),
      ctaBg: agree ? '#0F4C42' : '#93AFA8',
      ctaDisabled: agree ? 'false' : 'true'
    };
  }
}
</script>
</body>
</html>
