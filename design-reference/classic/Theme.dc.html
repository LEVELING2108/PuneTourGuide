<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pune Explorer — App theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=DM+Serif+Display&amp;family=Yatra+One&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F4C42}a:hover{color:#0A3730}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}.d4{animation-delay:.26s}.d5{animation-delay:.33s}
.tap{transition:transform .2s cubic-bezier(.2,.7,.2,1)}
.tap:active{transform:scale(.97)}
.opt{transition:border-color .35s,box-shadow .35s,transform .35s cubic-bezier(.2,.7,.2,1)}
.opt:hover{transform:translateY(-2px)}
.radio{transition:border .3s}
.cta{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .35s,background-color .4s}
.cta:hover{transform:translateY(-2px)}
.cta:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F6F3; font-family: 'Hanken Grotesk', sans-serif; color: #111614; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 20px">

  <div class="rise d1" style="display: flex; align-items: center">
    <a class="tap" href="Profile.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E1E4E0; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111614" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
  </div>

  <div class="rise d2" style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-size: 40px; font-weight: 400; line-height: 1">App <span style="font-style: italic; color: #0F4C42">theme</span></h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5E6763">Same app, same features. Pick the look you like. SOS always stays red.</p>
  </div>

  <div class="rise d3" role="radiogroup" aria-label="App theme" style="display: flex; flex-direction: column; gap: 14px">
    <button class="opt" role="radio" aria-checked="{{classicChecked}}" onClick="{{pickClassic}}" style="display: flex; flex-direction: column; gap: 12px; padding: 12px; border-radius: 22px; border: 2px solid {{classicBd}}; background: #FFFFFF; box-shadow: {{classicShadow}}; text-align: left; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif">
      <div style="height: 132px; width: 100%; border-radius: 14px; background: #F6F6F3; padding: 12px; box-sizing: border-box; display: flex; gap: 10px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
          <div style="font-family: 'Instrument Serif', serif; font-size: 22px; line-height: 1; color: #111614">Where to, <i style="color: #0F4C42">today?</i></div>
          <div style="flex: 1; border-radius: 12px; background: #0F4C42; padding: 8px 10px; color: #F6F6F3; display: flex; flex-direction: column; justify-content: flex-end; font-family: 'Instrument Serif', serif; font-size: 15px">Shaniwar Wada</div>
        </div>
        <div style="width: 72px; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 6px">
          <span style="border-radius: 8px; background: #4A3426"></span><span style="border-radius: 8px; background: #26303B"></span><span style="border-radius: 8px; background: #1B2220"></span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 0 4px">
        <div style="flex: 1">
          <div style="font-size: 15.5px; font-weight: 600; color: #111614">Classic</div>
          <div style="font-size: 12.5px; color: #5E6763">Calm emerald and ivory, modern serif</div>
        </div>
        <span class="radio" style="width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; border: {{classicRing}}; background: #FFFFFF"></span>
      </div>
    </button>

    <button class="opt" role="radio" aria-checked="{{deccanChecked}}" onClick="{{pickDeccan}}" style="display: flex; flex-direction: column; gap: 12px; padding: 12px; border-radius: 22px; border: 2px solid {{deccanBd}}; background: #FFFFFF; box-shadow: {{deccanShadow}}; text-align: left; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif">
      <div style="height: 132px; width: 100%; border-radius: 14px; background: #F3EADB; padding: 12px; box-sizing: border-box; display: flex; gap: 10px; position: relative; overflow: hidden">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
          <div style="font-family: 'Yatra One', sans-serif; font-size: 20px; line-height: 1.1; color: #7A1F4E">चला, फिरूया!</div>
          <div style="flex: 1; border-radius: 10px; background: #0E5B5E; position: relative; overflow: hidden">
            <svg width="200" height="8" viewBox="0 0 200 8" aria-hidden="true" style="position: absolute; top: 0; left: 0"><defs><pattern id="zt" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#C59A3A"></rect><path d="M0 8 L4 2 L8 8 Z" fill="#7A1F4E"></path></pattern></defs><rect width="200" height="8" fill="url(#zt)"></rect></svg>
            <svg width="200" height="34" viewBox="0 0 390 96" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 100%"><path d="M0 96 V66 H30 V54 a14 14 0 0 1 28 0 V66 H110 V58 H150 V66 H170 V44 a22 22 0 0 1 44 0 V66 H260 V56 a12 12 0 0 1 24 0 V66 H330 V50 a16 16 0 0 1 32 0 V66 H390 V96 Z" fill="#073638"></path></svg>
            <div style="position: absolute; left: 10px; top: 14px; font-family: 'DM Serif Display', serif; font-size: 15px; color: #FFFBF3">Shaniwar Wada</div>
          </div>
        </div>
        <div style="width: 72px; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 6px">
          <span style="border-radius: 3px; background: #7A1F4E; outline: 1.5px dashed #D8C6A6; outline-offset: 2px"></span><span style="border-radius: 3px; background: #A4462B; outline: 1.5px dashed #D8C6A6; outline-offset: 2px"></span><span style="border-radius: 3px; background: #C59A3A; outline: 1.5px dashed #D8C6A6; outline-offset: 2px"></span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 0 4px">
        <div style="flex: 1">
          <div style="font-size: 15.5px; font-weight: 600; color: #111614">Deccan</div>
          <div style="font-size: 12.5px; color: #5E6763">Paithani colours, fort skylines, travel stamps</div>
        </div>
        <span class="radio" style="width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; border: {{deccanRing}}; background: #FFFFFF"></span>
      </div>
    </button>
  </div>

  <a class="rise d4 cta" href="{{applyHref}}" style="margin-top: auto; height: 56px; border-radius: 28px; background: {{applyBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none">Use {{chosen}} theme</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: 'classic' };
  }
  renderVals() {
    const c = this.state.theme === 'classic';
    return {
      classicChecked: c ? 'true' : 'false',
      deccanChecked: c ? 'false' : 'true',
      classicBd: c ? '#0F4C42' : '#E4E6E2',
      deccanBd: c ? '#E4E6E2' : '#7A1F4E',
      classicShadow: c ? '0 18px 30px -20px rgba(15,76,66,0.6)' : 'none',
      deccanShadow: c ? 'none' : '0 18px 30px -20px rgba(122,31,78,0.6)',
      classicRing: c ? '7px solid #0F4C42' : '1.5px solid #B9C1BD',
      deccanRing: c ? '1.5px solid #B9C1BD' : '7px solid #7A1F4E',
      pickClassic: () => this.setState({ theme: 'classic' }),
      pickDeccan: () => this.setState({ theme: 'deccan' }),
      chosen: c ? 'Classic' : 'Deccan',
      applyHref: c ? 'Main.dc.html' : 'DeccanHome.dc.html',
      applyBg: c ? '#0F4C42' : '#7A1F4E'
    };
  }
}
</script>
</body>
</html>
