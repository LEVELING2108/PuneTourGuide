<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pune Explorer — Log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F4C42}a:hover{color:#0A3730}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) .1s both}
.swap{animation:swap .4s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.25s}.d4{animation-delay:.32s}.d5{animation-delay:.39s}.d6{animation-delay:.46s}
.rings{animation:spin 90s linear infinite;transform-origin:50% 50%}
.tap{transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .3s,background-color .3s,color .3s,border-color .3s}
.tap:active{transform:scale(.97)}
.gbtn:hover{border-color:#111614;box-shadow:0 12px 24px -16px rgba(17,22,20,.45)}
.field{transition:border-color .3s,box-shadow .3s}
.field:focus-within{border-color:#0F4C42;box-shadow:0 0 0 3px rgba(15,76,66,.12)}
.seg{transition:transform .45s cubic-bezier(.3,.8,.2,1)}
.segtxt{transition:color .35s}
.cta{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 30px -14px rgba(15,76,66,.7)}
.cta:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0F4C42; font-family: 'Hanken Grotesk', sans-serif; color: #111614">

  <svg class="rings" width="440" height="440" viewBox="0 0 440 440" aria-hidden="true" style="position: absolute; right: -170px; top: -150px; opacity: 0.16"><circle cx="220" cy="220" r="80" fill="none" stroke="#F6F6F3"></circle><circle cx="220" cy="220" r="130" fill="none" stroke="#F6F6F3" stroke-dasharray="2 6"></circle><circle cx="220" cy="220" r="180" fill="none" stroke="#F6F6F3"></circle><circle cx="220" cy="220" r="215" fill="none" stroke="#F6F6F3" stroke-dasharray="1 9"></circle></svg>

  <div style="position: absolute; top: 60px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 26px; color: #F6F6F3">
    <div class="rise d1" style="display: flex; align-items: center; gap: 10px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F6F6F3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
      <span style="font-family: 'Instrument Serif', serif; font-size: 22px">Pune Explorer</span>
    </div>
    <div class="rise d2" style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-size: 48px; font-weight: 400; line-height: 0.95">Welcome<br><span style="font-style: italic; color: #A9CFC6">back</span></h1>
      <div style="font-size: 14px; color: #CFE3DE">Log in to sync your plans, saves and XP.</div>
    </div>
  </div>

  <div class="up" style="position: absolute; left: 0; right: 0; top: 252px; bottom: 0; background: #F6F6F3; border-radius: 30px 30px 0 0; padding: 26px 24px 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">

    <a class="rise d3 tap gbtn" href="Main.dc.html" style="height: 54px; box-sizing: border-box; border-radius: 27px; border: 1px solid #D5DAD6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: 'Hanken Grotesk', sans-serif; font-size: 15px; font-weight: 600; color: #111614; text-decoration: none">
      <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; border: 1px dashed #9AA6A2; box-sizing: border-box; font-size: 7px; color: #5E6763; display: flex; align-items: center; justify-content: center">LOGO</span>
      Continue with Google</a>

    <div class="rise d3" style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #5E6763">
      <span style="flex: 1; height: 1px; background: #DDE1DD"></span>or<span style="flex: 1; height: 1px; background: #DDE1DD"></span>
    </div>

    <div class="rise d4" role="tablist" aria-label="Log in with" style="position: relative; height: 44px; border-radius: 22px; background: #E9EBE7; padding: 4px; box-sizing: border-box; display: flex">
      <div class="seg" style="position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: 36px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 2px 8px -2px rgba(17,22,20,0.2); transform: translateX({{segX}})"></div>
      <button class="segtxt" role="tab" aria-selected="{{emailSel}}" onClick="{{pickEmail}}" style="position: relative; flex: 1; border: none; background: transparent; font-family: 'Hanken Grotesk', sans-serif; font-size: 13.5px; font-weight: 600; color: {{emailColor}}; cursor: pointer">Email</button>
      <button class="segtxt" role="tab" aria-selected="{{phoneSel}}" onClick="{{pickPhone}}" style="position: relative; flex: 1; border: none; background: transparent; font-family: 'Hanken Grotesk', sans-serif; font-size: 13.5px; font-weight: 600; color: {{phoneColor}}; cursor: pointer">Mobile number</button>
    </div>

    <sc-if value="{{isEmail}}" hint-placeholder-val="{{ true }}">
      <div class="swap" style="display: flex; flex-direction: column; gap: 12px">
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #5E6763">EMAIL</span>
          <span class="field" style="height: 50px; border-radius: 14px; border: 1px solid #DDE1DD; background: #FFFFFF; display: flex; align-items: center; padding: 0 16px"><input type="email" placeholder="you@example.com" autocomplete="email" style="border: none; outline: none; flex: 1; min-width: 0; font-family: 'Hanken Grotesk', sans-serif; font-size: 15px; background: transparent; color: #111614"></span>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="display: flex; justify-content: space-between; align-items: baseline">
            <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #5E6763">PASSWORD</span>
            <a href="ForgotPassword.dc.html" style="font-size: 12.5px; font-weight: 600; text-decoration: none">Forgot?</a>
          </span>
          <span class="field" style="height: 50px; border-radius: 14px; border: 1px solid #DDE1DD; background: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 16px">
            <input type="{{pwType}}" placeholder="Your password" autocomplete="current-password" style="border: none; outline: none; flex: 1; min-width: 0; font-family: 'Hanken Grotesk', sans-serif; font-size: 15px; background: transparent; color: #111614">
            <button class="tap" onClick="{{toggleShow}}" aria-label="{{showLabel}}" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <sc-if value="{{hidden}}" hint-placeholder-val="{{ true }}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6763" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </sc-if>
              <sc-if value="{{shown}}" hint-placeholder-val="{{ false }}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F4C42" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3 3.9M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
              </sc-if>
            </button>
          </span>
        </label>
        <a class="cta" href="Main.dc.html" style="height: 56px; border-radius: 28px; background: #0F4C42; color: #F6F6F3; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none; margin-top: 4px">Log in</a>
      </div>
    </sc-if>

    <sc-if value="{{isPhone}}" hint-placeholder-val="{{ false }}">
      <div class="swap" style="display: flex; flex-direction: column; gap: 12px">
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #5E6763">MOBILE NUMBER</span>
          <span class="field" style="height: 50px; border-radius: 14px; border: 1px solid #DDE1DD; background: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 6px">
            <span style="height: 38px; padding: 0 10px; border-radius: 10px; background: #F0F1EE; display: flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 600; color: #111614">IN +91
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5E6763" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span>
            <input type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="98XXX XXXXX" style="border: none; outline: none; flex: 1; min-width: 0; font-family: 'Hanken Grotesk', sans-serif; font-size: 16px; letter-spacing: 0.04em; background: transparent; color: #111614">
          </span>
        </label>
        <div style="font-size: 12.5px; line-height: 1.45; color: #5E6763">We'll text a 6-digit code to this number. New here? The same code creates your account.</div>
        <a class="cta" href="Otp.dc.html" style="height: 56px; border-radius: 28px; background: #0F4C42; color: #F6F6F3; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none; margin-top: 4px">Send code</a>
      </div>
    </sc-if>

    <div class="rise d6" style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 13.5px; color: #5E6763">
      <div>New to Pune Explorer? <a href="SignUp.dc.html" style="font-weight: 600; text-decoration: none">Create account</a></div>
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #5E6763; text-decoration: none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"></path></svg>
        Skip for now · SOS works without an account</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: false, mode: 'email' };
  }
  renderVals() {
    const { show, mode } = this.state;
    const email = mode === 'email';
    return {
      isEmail: email,
      isPhone: !email,
      segX: email ? '0%' : '100%',
      emailSel: email ? 'true' : 'false',
      phoneSel: email ? 'false' : 'true',
      emailColor: email ? '#111614' : '#5E6763',
      phoneColor: email ? '#5E6763' : '#111614',
      pickEmail: () => this.setState({ mode: 'email' }),
      pickPhone: () => this.setState({ mode: 'phone' }),
      pwType: show ? 'text' : 'password',
      hidden: !show,
      shown: show,
      showLabel: show ? 'Hide password' : 'Show password',
      toggleShow: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ show: !show }); }
    };
  }
}
</script>
</body>
</html>
