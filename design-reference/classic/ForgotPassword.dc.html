<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pune Explorer — Forgot password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F4C42}a:hover{color:#0A3730}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popin{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) .1s both}
.swap{animation:swap .45s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:popin .55s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.25s}.d4{animation-delay:.32s}
.rings{animation:spin 90s linear infinite;transform-origin:50% 50%}
.tap{transition:transform .2s cubic-bezier(.2,.7,.2,1),background-color .3s}
.tap:active{transform:scale(.97)}
.field{transition:border-color .3s,box-shadow .3s}
.field:focus-within{border-color:#0F4C42;box-shadow:0 0 0 3px rgba(15,76,66,.12)}
.cta{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 30px -14px rgba(15,76,66,.7)}
.cta:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0F4C42; font-family: 'Hanken Grotesk', sans-serif; color: #111614">

  <svg class="rings" width="440" height="440" viewBox="0 0 440 440" aria-hidden="true" style="position: absolute; right: -170px; top: -150px; opacity: 0.16"><circle cx="220" cy="220" r="80" fill="none" stroke="#F6F6F3"></circle><circle cx="220" cy="220" r="130" fill="none" stroke="#F6F6F3" stroke-dasharray="2 6"></circle><circle cx="220" cy="220" r="180" fill="none" stroke="#F6F6F3"></circle><circle cx="220" cy="220" r="215" fill="none" stroke="#F6F6F3" stroke-dasharray="1 9"></circle></svg>

  <div style="position: absolute; top: 56px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 24px; color: #F6F6F3">
    <a class="rise d1 tap" href="Login.dc.html" aria-label="Back to log in" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid rgba(246,246,243,0.3); display: flex; align-items: center; justify-content: center">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F6F6F3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="rise d2" style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-size: 46px; font-weight: 400; line-height: 0.95">Reset your<br><span style="font-style: italic; color: #A9CFC6">password</span></h1>
      <div style="font-size: 14px; color: #CFE3DE">It happens. We'll email you a link to set a new one.</div>
    </div>
  </div>

  <div class="up" style="position: absolute; left: 0; right: 0; top: 268px; bottom: 0; background: #F6F6F3; border-radius: 30px 30px 0 0; padding: 30px 24px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">

    <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
      <div class="swap" style="display: flex; flex-direction: column; gap: 16px">
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #5E6763">EMAIL</span>
          <span class="field" style="height: 50px; border-radius: 14px; border: 1px solid #DDE1DD; background: #FFFFFF; display: flex; align-items: center; padding: 0 16px"><input type="email" placeholder="you@example.com" autocomplete="email" style="border: none; outline: none; flex: 1; min-width: 0; font-family: 'Hanken Grotesk', sans-serif; font-size: 15px; background: transparent; color: #111614"></span>
        </label>
        <button class="cta" onClick="{{send}}" style="height: 56px; border-radius: 28px; border: none; background: #0F4C42; color: #F6F6F3; font-family: 'Hanken Grotesk', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Send reset link</button>
        <div style="font-size: 13px; line-height: 1.45; color: #5E6763; text-align: center">Signed up with your mobile? <a href="Login.dc.html" style="font-weight: 600; text-decoration: none">Log in with a code instead</a></div>
      </div>
    </sc-if>

    <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
      <div class="swap" style="display: flex; flex-direction: column; gap: 18px; align-items: center; text-align: center; padding-top: 8px">
        <div class="pop" style="width: 64px; height: 64px; border-radius: 32px; background: #E8F0ED; display: flex; align-items: center; justify-content: center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0F4C42" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="font-family: 'Instrument Serif', serif; font-size: 28px">Check your inbox</div>
          <div style="font-size: 14px; line-height: 1.5; color: #5E6763">If there's an account for that email, a reset link is on its way. It works for 30 minutes.</div>
        </div>
        <a class="cta" href="mailto:" style="width: 100%; height: 56px; border-radius: 28px; background: #0F4C42; color: #F6F6F3; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none">Open email app</a>
        <div style="display: flex; gap: 18px; font-size: 13.5px">
          <button class="tap" onClick="{{again}}" style="border: none; background: transparent; padding: 0; font-family: 'Hanken Grotesk', sans-serif; font-size: 13.5px; font-weight: 600; color: #0F4C42; cursor: pointer">Send again</button>
          <a href="Login.dc.html" style="font-weight: 600; text-decoration: none">Back to log in</a>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false };
  }
  renderVals() {
    const sent = this.state.sent;
    return {
      sent,
      notSent: !sent,
      send: () => this.setState({ sent: true }),
      again: () => this.setState({ sent: false })
    };
  }
}
</script>
</body>
</html>
