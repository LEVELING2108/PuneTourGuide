<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pune Explorer — Filters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F4C42}a:hover{color:#0A3730}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.scrim{animation:fade .45s ease both}
.up{animation:up .55s cubic-bezier(.2,.8,.2,1) .05s both}
.tap{transition:transform .2s cubic-bezier(.2,.7,.2,1),background-color .3s,color .3s,border-color .3s}
.tap:active{transform:scale(.97)}
.knob{transition:left .35s cubic-bezier(.3,.8,.2,1)}
.track{transition:background-color .35s}
.cta{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 30px -14px rgba(15,76,66,.7)}
.cta:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F6F3; font-family: 'Hanken Grotesk', sans-serif; color: #111614">
  <dc-import name="Explore" hint-size="390px,844px"></dc-import>
  <a class="scrim" href="Explore.dc.html" aria-label="Close filters" style="position: absolute; inset: 0; background: rgba(17,22,20,0.5)"></a>

  <div class="up" role="dialog" aria-label="Filters" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 30px 30px 0 0; padding: 12px 24px 32px; display: flex; flex-direction: column; gap: 18px">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: #D5DAD6; align-self: center"></div>
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-size: 30px; font-weight: 400">Filters</h2>
      <button class="tap" onClick="{{reset}}" style="border: none; background: transparent; padding: 0; font-family: 'Hanken Grotesk', sans-serif; font-size: 13.5px; font-weight: 600; color: #0F4C42; cursor: pointer">Reset</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #5E6763">DISTANCE</div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{dists}}" as="d" hint-placeholder-count="4">
          <button class="tap" onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="height: 42px; border-radius: 14px; border: 1px solid {{d.bd}}; background: {{d.bg}}; color: {{d.fg}}; font-family: 'Hanken Grotesk', sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">{{d.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column">
      <sc-for list="{{toggles}}" as="t" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid #ECEEEA">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <div style="font-size: 14.5px; font-weight: 600">{{t.title}}</div>
            <div style="font-size: 12.5px; color: #5E6763">{{t.sub}}</div>
          </div>
          <button onClick="{{t.flip}}" aria-label="{{t.title}}" aria-pressed="{{t.pressed}}" style="position: relative; width: 52px; height: 32px; border: none; padding: 0; background: transparent; cursor: pointer; flex-shrink: 0">
            <span class="track" style="position: absolute; inset: 0; border-radius: 16px; background: {{t.trackBg}}"></span>
            <span class="knob" style="position: absolute; top: 4px; left: {{t.knob}}; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.25)"></span></button>
        </div>
      </sc-for>
    </div>

    <a class="cta" href="Explore.dc.html" style="height: 56px; border-radius: 28px; background: #0F4C42; color: #F6F6F3; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none">Show {{count}} places</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dist: '5 km', open: true, free: false, access: false, help: true };
  }
  renderVals() {
    const s = this.state;
    const dists = ['1 km', '5 km', '10 km', 'Any'].map((label) => {
      const on = label === s.dist;
      return { label, pressed: on ? 'true' : 'false', bg: on ? '#111614' : '#FFFFFF', fg: on ? '#F6F6F3' : '#111614', bd: on ? '#111614' : '#E1E4E0', pick: () => this.setState({ dist: label }) };
    });
    const defs = [
      { key: 'open', title: 'Open now', sub: 'Hide places that are closed right now' },
      { key: 'free', title: 'Free entry', sub: 'No ticket needed' },
      { key: 'access', title: 'Wheelchair friendly', sub: 'Step-free entry reported' },
      { key: 'help', title: 'Hospital within 2 km', sub: 'Only places close to medical help' }
    ];
    const toggles = defs.map((d) => {
      const on = !!s[d.key];
      return { ...d, pressed: on ? 'true' : 'false', trackBg: on ? '#0F4C42' : '#C9D0CC', knob: on ? '24px' : '4px', flip: () => this.setState({ [d.key]: !on }) };
    });
    const base = { '1 km': 6, '5 km': 18, '10 km': 24, 'Any': 31 }[s.dist];
    let count = base;
    if (s.open) count -= 3;
    if (s.free) count -= 5;
    if (s.access) count -= 6;
    if (s.help) count -= 2;
    return {
      dists,
      toggles,
      count: Math.max(1, count),
      reset: () => this.setState({ dist: 'Any', open: false, free: false, access: false, help: false })
    };
  }
}
</script>
</body>
</html>
