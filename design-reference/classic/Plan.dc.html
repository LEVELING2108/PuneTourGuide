<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pune Explorer — Day plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F4C42}a:hover{color:#0A3730}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}.d4{animation-delay:.26s}.d5{animation-delay:.33s}.d6{animation-delay:.4s}
.tap{transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .3s,background-color .3s,color .3s,border-color .3s}
.tap:active{transform:scale(.96)}
.seg{transition:transform .45s cubic-bezier(.3,.8,.2,1)}
.segtxt{transition:color .35s}
.knob{transition:left .35s cubic-bezier(.3,.8,.2,1)}
.track{transition:background-color .35s}
.card{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,opacity .35s}
.card:hover{transform:translateY(-2px);box-shadow:0 16px 30px -20px rgba(17,22,20,.45)}
.check{transition:background-color .3s,border-color .3s}
.navi:hover{color:#F6F6F3}
@keyframes toast{0%{opacity:0;transform:translateY(16px)}12%{opacity:1;transform:none}85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(8px)}}
.toast{animation:toast 3s ease both}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F6F3; font-family: 'Hanken Grotesk', sans-serif; color: #111614">
  <div style="padding: 60px 24px 0; display: flex; flex-direction: column; gap: 20px">

    <div class="rise d1" style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.16em; color: #5E6763">YOUR PLAN · {{xpLabel}}</div>
        <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-size: 44px; font-weight: 400; line-height: 0.98">{{dayName}}</h1>
      </div>
      <button class="tap" onClick="{{optimise}}" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #E1E4E0; background: #FFFFFF; font-family: 'Hanken Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: #111614; display: flex; align-items: center; gap: 8px; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6 4 4 6-8"></path><path d="M15 7h5v5"></path></svg>{{optLabel}}</button>
    </div>

    <div class="rise d2" style="position: relative; height: 46px; border-radius: 23px; background: #E9EBE7; padding: 4px; box-sizing: border-box; display: flex">
      <div class="seg" style="position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: 38px; border-radius: 19px; background: #111614; transform: translateX({{segX}})"></div>
      <button class="segtxt" onClick="{{pickDay1}}" style="position: relative; flex: 1; border: none; background: transparent; font-family: 'Hanken Grotesk', sans-serif; font-size: 13.5px; font-weight: 600; color: {{day1Color}}; cursor: pointer">Day 1 · Sat</button>
      <button class="segtxt" onClick="{{pickDay2}}" style="position: relative; flex: 1; border: none; background: transparent; font-family: 'Hanken Grotesk', sans-serif; font-size: 13.5px; font-weight: 600; color: {{day2Color}}; cursor: pointer">Day 2 · Sun</button>
    </div>

    <div class="rise d3" style="display: flex; flex-direction: column">
      <sc-for list="{{stops}}" as="s" hint-placeholder-count="3">
        <div style="display: flex; gap: 14px">
          <div style="display: flex; flex-direction: column; align-items: center; width: 24px">
            <button class="check tap" onClick="{{s.toggle}}" aria-label="Mark visited" style="width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid {{s.ring}}; background: {{s.fill}}; margin-top: 2px; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F6F6F3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></button>
            <div style="flex: 1; width: 1px; background: #D5DAD6; display: {{s.line}}"></div>
          </div>
          <div style="flex: 1; padding-bottom: 16px; display: flex; flex-direction: column; gap: 8px">
            <div style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.14em; color: #5E6763">{{s.time}}</div>
            <div class="card" style="background: #FFFFFF; border: 1px solid #E4E6E2; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; opacity: {{s.opacity}}">
              <div style="display: flex; justify-content: space-between; align-items: baseline">
                <div style="font-family: 'Instrument Serif', serif; font-size: 22px; line-height: 1.05">{{s.name}}</div>
                <div style="font-size: 12px; font-weight: 600; color: #8A6420">{{s.xp}}</div>
              </div>
              <div style="font-size: 12.5px; color: {{s.helpColor}}">{{s.help}}</div>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <div class="rise d4" style="background: #111614; color: #F6F6F3; border-radius: 22px; padding: 16px 18px; display: flex; align-items: center; gap: 14px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
        <div style="font-size: 14.5px; font-weight: 600">Share live trip</div>
        <div style="font-size: 12.5px; color: #A3ADA9">{{shareText}}</div>
      </div>
      <button onClick="{{toggleShare}}" aria-label="Share live trip" aria-pressed="{{sharing}}" style="position: relative; width: 52px; height: 32px; border-radius: 16px; border: none; padding: 0; background: transparent; cursor: pointer; flex-shrink: 0">
        <span class="track" style="position: absolute; inset: 0; border-radius: 16px; background: {{trackBg}}"></span>
        <span class="knob" style="position: absolute; top: 4px; left: {{knobLeft}}; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.25)"></span>
      </button>
    </div>
  </div>

  <sc-if value="{{showToast}}" hint-placeholder-val="{{ false }}">
    <div class="toast" role="status" style="position: absolute; left: 24px; right: 24px; bottom: 100px; padding: 13px 16px; border-radius: 16px; background: #111614; color: #F6F6F3; font-size: 13px; display: flex; align-items: center; gap: 10px; box-shadow: 0 16px 30px -14px rgba(17,22,20,0.6); z-index: 3">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #2FA58A; flex-shrink: 0"></span>{{toastText}}</div>
  </sc-if>

  <nav class="rise d6" aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 64px; border-radius: 32px; background: #111614; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; box-sizing: border-box; box-shadow: 0 20px 40px -18px rgba(17,22,20,0.6)">
    <a class="tap navi" href="Main.dc.html" aria-label="Home" style="width: 48px; height: 48px; border-radius: 24px; color: #A3ADA9; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></a>
    <a class="tap navi" href="Explore.dc.html" aria-label="Explore" style="width: 48px; height: 48px; border-radius: 24px; color: #A3ADA9; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg></a>
    <a class="tap navi" href="Map.dc.html" aria-label="Map" style="width: 48px; height: 48px; border-radius: 24px; color: #A3ADA9; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"></path></svg></a>
    <a class="tap" href="Plan.dc.html" style="height: 48px; padding: 0 18px; border-radius: 24px; background: #F6F6F3; color: #111614; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Plan</a>
    <a class="tap navi" href="Profile.dc.html" aria-label="Profile" style="width: 48px; height: 48px; border-radius: 24px; color: #A3ADA9; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 1, sharing: true, done: { 'Shaniwar Wada': true }, busy: false, toast: 0, flipped: { 2: false } };
  }
  componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); }
  renderVals() {
    const days = {
      1: [
        { time: '9:30 AM', name: 'Shaniwar Wada', xp: 40, help: 'KEM Hospital · 1.2 km' },
        { time: '11:30 AM', name: 'Dagdusheth Ganpati', xp: 30, help: 'KEM Hospital · 0.9 km' },
        { time: '3:00 PM', name: 'Sinhagad Fort trek', xp: 80, help: 'Weak signal · help list saved offline', warn: true }
      ],
      2: [
        { time: '10:00 AM', name: 'Aga Khan Palace', xp: 40, help: 'Ruby Hall Clinic · 4 km' },
        { time: '1:00 PM', name: 'Pataleshwar Caves', xp: 30, help: 'Hospital · 1.6 km' },
        { time: '5:30 PM', name: 'Parvati Hill', xp: 30, help: 'Hospital · 2 km' }
      ]
    };
    const day = this.state.day;
    if (this.state.flipped[2]) {
      days[2] = [
        { time: '10:00 AM', name: 'Pataleshwar Caves', xp: 30, help: 'Hospital · 1.6 km' },
        { time: '12:30 PM', name: 'Aga Khan Palace', xp: 40, help: 'Ruby Hall Clinic · 4 km' },
        { time: '5:30 PM', name: 'Parvati Hill', xp: 30, help: 'Hospital · 2 km' }
      ];
    }
    const list = days[day];
    let earned = 0;
    const stops = list.map((s, i) => {
      const done = !!this.state.done[s.name];
      if (done) earned += s.xp;
      return {
        ...s,
        xp: '+' + s.xp + ' XP',
        helpColor: s.warn ? '#8A4A12' : '#5E6763',
        ring: done ? '#0F4C42' : '#9AA6A2',
        fill: done ? '#0F4C42' : '#FFFFFF',
        opacity: done ? 0.62 : 1,
        line: i === list.length - 1 ? 'none' : 'block',
        toggle: () => this.setState({ done: { ...this.state.done, [s.name]: !done } })
      };
    });
    const sharing = this.state.sharing;
    return {
      stops,
      dayName: day === 1 ? 'Saturday' : 'Sunday',
      xpLabel: earned + ' XP EARNED',
      segX: day === 1 ? '0%' : '100%',
      day1Color: day === 1 ? '#F6F6F3' : '#5E6763',
      day2Color: day === 2 ? '#F6F6F3' : '#5E6763',
      pickDay1: () => this.setState({ day: 1 }),
      pickDay2: () => this.setState({ day: 2 }),
      sharing: sharing ? 'true' : 'false',
      trackBg: sharing ? '#2FA58A' : '#3A423F',
      knobLeft: sharing ? '24px' : '4px',
      shareText: sharing ? 'Aai and Aman can follow your route' : 'Off · nobody can see your location',
      toggleShare: () => this.setState({ sharing: !sharing }),
      optLabel: this.state.busy ? 'Optimising…' : 'Optimise',
      showToast: this.state.toast > 0,
      toastText: day === 1 || this.state.flipped[2] ? 'Already the best order for today' : 'Reordered · saves about 25 min of travel',
      optimise: () => {
        if (this.state.busy) return;
        clearTimeout(this.t1); clearTimeout(this.t2);
        this.setState({ busy: true, toast: 0 });
        this.t1 = setTimeout(() => {
          const flipped = day === 2 ? { 2: true } : this.state.flipped;
          this.setState({ busy: false, toast: Date.now(), flipped: { ...flipped } });
          this.t2 = setTimeout(() => this.setState({ toast: 0 }), 3100);
        }, 900);
      }
    };
  }
}
</script>
</body>
</html>
