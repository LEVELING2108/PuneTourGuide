<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pune Explorer — Enter code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F4C42}a:hover{color:#0A3730}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) .1s both}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.25s}.d4{animation-delay:.32s}.d5{animation-delay:.39s}.d6{animation-delay:.46s}
.rings{animation:spin 90s linear infinite;transform-origin:50% 50%}
.cell{transition:border-color .25s,box-shadow .25s,background-color .25s}
.caret{animation:blink 1s step-end infinite}
.digit{animation:pop .3s cubic-bezier(.2,.7,.2,1)}
.tap{transition:transform .2s cubic-bezier(.2,.7,.2,1),background-color .3s,color .3s}
.tap:active{transform:scale(.97)}
.cta{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .35s,background-color .35s}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 30px -14px rgba(15,76,66,.7)}
.cta:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0F4C42; font-family: 'Hanken Grotesk', sans-serif; color: #111614">

  <svg class="rings" width="440" height="440" viewBox="0 0 440 440" aria-hidden="true" style="position: absolute; right: -170px; top: -150px; opacity: 0.16"><circle cx="220" cy="220" r="80" fill="none" stroke="#F6F6F3"></circle><circle cx="220" cy="220" r="130" fill="none" stroke="#F6F6F3" stroke-dasharray="2 6"></circle><circle cx="220" cy="220" r="180" fill="none" stroke="#F6F6F3"></circle><circle cx="220" cy="220" r="215" fill="none" stroke="#F6F6F3" stroke-dasharray="1 9"></circle></svg>

  <div style="position: absolute; top: 56px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 24px; color: #F6F6F3">
    <a class="rise d1 tap" href="Login.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid rgba(246,246,243,0.3); display: flex; align-items: center; justify-content: center">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F6F6F3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="rise d2" style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-size: 46px; font-weight: 400; line-height: 0.95">Check your<br><span style="font-style: italic; color: #A9CFC6">messages</span></h1>
      <div style="font-size: 14px; color: #CFE3DE">We sent a 6-digit code to <b style="color: #F6F6F3; font-weight: 600">+91 98••• ••210</b></div>
    </div>
  </div>

  <div class="up" style="position: absolute; left: 0; right: 0; top: 268px; bottom: 0; background: #F6F6F3; border-radius: 30px 30px 0 0; padding: 30px 24px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">

    <label class="rise d3" style="position: relative; display: block">
      <span style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #5E6763; margin-bottom: 10px">ENTER CODE</span>
      <span style="position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="6">
          <span class="cell" style="height: 60px; border-radius: 16px; border: 1.5px solid {{c.bd}}; background: #FFFFFF; box-shadow: {{c.shadow}}; display: flex; align-items: center; justify-content: center; font-family: 'Instrument Serif', serif; font-size: 30px; color: #111614">
            <sc-if value="{{c.filled}}" hint-placeholder-val="{{ false }}"><span class="digit">{{c.d}}</span></sc-if>
            <sc-if value="{{c.caret}}" hint-placeholder-val="{{ false }}"><span class="caret" style="width: 1.5px; height: 26px; background: #0F4C42"></span></sc-if>
          </span>
        </sc-for>
        <input aria-label="6-digit code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" onInput="{{onCode}}" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: none; font-size: 16px; color: transparent; background: transparent; caret-color: transparent; cursor: text">
      </span>
    </label>

    <div class="rise d4" style="display: flex; justify-content: space-between; align-items: center; font-size: 13.5px">
      <span style="color: #5E6763">Didn't get it?</span>
      <sc-if value="{{waiting}}" hint-placeholder-val="{{ true }}">
        <span style="color: #5E6763">Resend in <b style="color: #111614; font-weight: 600; font-variant-numeric: tabular-nums">0:{{secs}}</b></span>
      </sc-if>
      <sc-if value="{{canResend}}" hint-placeholder-val="{{ false }}">
        <span style="display: flex; gap: 16px">
          <button class="tap" onClick="{{resend}}" style="border: none; background: transparent; padding: 0; font-family: 'Hanken Grotesk', sans-serif; font-size: 13.5px; font-weight: 600; color: #0F4C42; cursor: pointer">Resend SMS</button>
          <button class="tap" onClick="{{resend}}" style="border: none; background: transparent; padding: 0; font-family: 'Hanken Grotesk', sans-serif; font-size: 13.5px; font-weight: 600; color: #0F4C42; cursor: pointer">Call me</button>
        </span>
      </sc-if>
    </div>

    <a class="rise d5 cta" href="PhoneName.dc.html" aria-disabled="{{ctaDisabled}}" style="height: 56px; border-radius: 28px; background: {{ctaBg}}; color: #F6F6F3; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none">Verify</a>

    <div class="rise d6" style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 13px; color: #5E6763; text-align: center">
      <div>Wrong number? <a href="Login.dc.html" style="font-weight: 600; text-decoration: none">Change it</a></div>
      <div style="font-size: 12px">The code fills in automatically on most phones.</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { code: '', secs: 30 };
  }
  componentDidMount() { this.startTimer(); }
  componentWillUnmount() { clearInterval(this.timer); }
  startTimer() {
    clearInterval(this.timer);
    this.timer = setInterval(() => {
      if (this.state.secs <= 0) { clearInterval(this.timer); return; }
      this.setState({ secs: this.state.secs - 1 });
    }, 1000);
  }
  renderVals() {
    const { code, secs } = this.state;
    const cells = [0, 1, 2, 3, 4, 5].map((i) => {
      const filled = i < code.length;
      const active = i === code.length;
      return {
        d: code[i] || '',
        filled,
        caret: active,
        bd: active ? '#0F4C42' : filled ? '#9AB5AE' : '#DDE1DD',
        shadow: active ? '0 0 0 3px rgba(15,76,66,0.12)' : 'none'
      };
    });
    const done = code.length === 6;
    return {
      cells,
      secs: secs < 10 ? '0' + secs : String(secs),
      waiting: secs > 0,
      canResend: secs <= 0,
      resend: () => { this.setState({ secs: 30 }); this.startTimer(); },
      onCode: (e) => {
        const v = String(e.target.value || '').replace(/\D/g, '').slice(0, 6);
        e.target.value = v;
        this.setState({ code: v });
      },
      ctaBg: done ? '#0F4C42' : '#93AFA8',
      ctaDisabled: done ? 'false' : 'true'
    };
  }
}
</script>
</body>
</html>
