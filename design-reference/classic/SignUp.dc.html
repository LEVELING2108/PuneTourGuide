<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pune Explorer — Sign up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F4C42}a:hover{color:#0A3730}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) .1s both}
.swap{animation:swap .4s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.25s}.d4{animation-delay:.32s}.d5{animation-delay:.39s}.d6{animation-delay:.46s}
.rings{animation:spin 90s linear infinite;transform-origin:50% 50%}
.tap{transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .3s,background-color .3s,color .3s,border-color .3s}
.tap:active{transform:scale(.97)}
.gbtn:hover{border-color:#111614;box-shadow:0 12px 24px -16px rgba(17,22,20,.45)}
.field{transition:border-color .3s,box-shadow .3s}
.field:focus-within{border-color:#0F4C42;box-shadow:0 0 0 3px rgba(15,76,66,.12)}
.seg{transition:transform .45s cubic-bezier(.3,.8,.2,1)}
.segtxt{transition:color .35s}
.bar{transition:background-color .35s}
.box{transition:background-color .25s,border-color .25s}
.cta{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .35s,background-color .35s}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 30px -14px rgba(15,76,66,.7)}
.cta:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0F4C42; font-family: 'Hanken Grotesk', sans-serif; color: #111614">

  <svg class="rings" width="440" height="440" viewBox="0 0 440 440" aria-hidden="true" style="position: absolute; right: -170px; top: -160px; opacity: 0.16"><circle cx="220" cy="220" r="80" fill="none" stroke="#F6F6F3"></circle><circle cx="220" cy="220" r="130" fill="none" stroke="#F6F6F3" stroke-dasharray="2 6"></circle><circle cx="220" cy="220" r="180" fill="none" stroke="#F6F6F3"></circle><circle cx="220" cy="220" r="215" fill="none" stroke="#F6F6F3" stroke-dasharray="1 9"></circle></svg>

  <div style="position: absolute; top: 56px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 20px; color: #F6F6F3">
    <div class="rise d1" style="display: flex; align-items: center; justify-content: space-between">
      <a class="tap" href="Login.dc.html" aria-label="Back to log in" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid rgba(246,246,243,0.3); display: flex; align-items: center; justify-content: center">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F6F6F3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <span style="font-family: 'Instrument Serif', serif; font-size: 19px">Pune Explorer</span>
      <span style="width: 40px"></span>
    </div>
    <h1 class="rise d2" style="margin: 0; font-family: 'Instrument Serif', serif; font-size: 42px; font-weight: 400; line-height: 0.95">Create your <span style="font-style: italic; color: #A9CFC6">account</span></h1>
  </div>

  <div class="up" style="position: absolute; left: 0; right: 0; top: 206px; bottom: 0; background: #F6F6F3; border-radius: 30px 30px 0 0; padding: 24px 24px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 13px">

    <a class="rise d3 tap gbtn" href="Onboard.dc.html" style="height: 54px; box-sizing: border-box; flex-shrink: 0; border-radius: 27px; border: 1px solid #D5DAD6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: 'Hanken Grotesk', sans-serif; font-size: 15px; font-weight: 600; color: #111614; text-decoration: none">
      <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; border: 1px dashed #9AA6A2; box-sizing: border-box; font-size: 7px; color: #5E6763; display: flex; align-items: center; justify-content: center">LOGO</span>
      Sign up with Google</a>

    <div class="rise d4" role="tablist" aria-label="Sign up with" style="position: relative; height: 44px; flex-shrink: 0; border-radius: 22px; background: #E9EBE7; padding: 4px; box-sizing: border-box; display: flex">
      <div class="seg" style="position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: 36px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 2px 8px -2px rgba(17,22,20,0.2); transform: translateX({{segX}})"></div>
      <button class="segtxt" role="tab" aria-selected="{{emailSel}}" onClick="{{pickEmail}}" style="position: relative; flex: 1; border: none; background: transparent; font-family: 'Hanken Grotesk', sans-serif; font-size: 13.5px; font-weight: 600; color: {{emailColor}}; cursor: pointer">Email</button>
      <button class="segtxt" role="tab" aria-selected="{{phoneSel}}" onClick="{{pickPhone}}" style="position: relative; flex: 1; border: none; background: transparent; font-family: 'Hanken Grotesk', sans-serif; font-size: 13.5px; font-weight: 600; color: {{phoneColor}}; cursor: pointer">Mobile number</button>
    </div>

    <label class="rise d4" style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #5E6763">NAME</span>
      <span class="field" style="height: 48px; border-radius: 14px; border: 1px solid #DDE1DD; background: #FFFFFF; display: flex; align-items: center; padding: 0 16px"><input placeholder="Your name" autocomplete="name" style="border: none; outline: none; flex: 1; min-width: 0; font-family: 'Hanken Grotesk', sans-serif; font-size: 15px; background: transparent; color: #111614"></span>
    </label>

    <sc-if value="{{isEmail}}" hint-placeholder-val="{{ true }}">
      <div class="swap" style="display: flex; flex-direction: column; gap: 11px">
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #5E6763">EMAIL</span>
          <span class="field" style="height: 48px; border-radius: 14px; border: 1px solid #DDE1DD; background: #FFFFFF; display: flex; align-items: center; padding: 0 16px"><input type="email" placeholder="you@example.com" autocomplete="email" style="border: none; outline: none; flex: 1; min-width: 0; font-family: 'Hanken Grotesk', sans-serif; font-size: 15px; background: transparent; color: #111614"></span>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #5E6763">PASSWORD</span>
          <span class="field" style="height: 48px; border-radius: 14px; border: 1px solid #DDE1DD; background: #FFFFFF; display: flex; align-items: center; padding: 0 16px"><input type="password" placeholder="At least 8 characters" autocomplete="new-password" onInput="{{onPw}}" style="border: none; outline: none; flex: 1; min-width: 0; font-family: 'Hanken Grotesk', sans-serif; font-size: 15px; background: transparent; color: #111614"></span>
        </label>
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
            <sc-for list="{{segs}}" as="s" hint-placeholder-count="4">
              <span class="bar" style="height: 4px; border-radius: 2px; background: {{s.bg}}"></span>
            </sc-for>
          </div>
          <span style="font-size: 12px; font-weight: 600; color: {{strengthColor}}; min-width: 64px; text-align: right">{{strengthLabel}}</span>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isPhone}}" hint-placeholder-val="{{ false }}">
      <div class="swap" style="display: flex; flex-direction: column; gap: 8px">
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #5E6763">MOBILE NUMBER</span>
          <span class="field" style="height: 48px; border-radius: 14px; border: 1px solid #DDE1DD; background: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 5px">
            <span style="height: 38px; padding: 0 10px; border-radius: 10px; background: #F0F1EE; display: flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 600; color: #111614">IN +91
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5E6763" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span>
            <input type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="98XXX XXXXX" style="border: none; outline: none; flex: 1; min-width: 0; font-family: 'Hanken Grotesk', sans-serif; font-size: 16px; letter-spacing: 0.04em; background: transparent; color: #111614">
          </span>
        </label>
        <div style="font-size: 12.5px; line-height: 1.45; color: #5E6763">No password needed. We'll text you a 6-digit code to confirm it's you.</div>
      </div>
    </sc-if>

    <button class="rise d5" onClick="{{toggleAgree}}" role="checkbox" aria-checked="{{agreeChecked}}" style="display: flex; align-items: flex-start; gap: 10px; border: none; background: transparent; padding: 0; text-align: left; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif">
      <span class="box" style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid {{boxBd}}; background: {{boxBg}}; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 1px">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F6F6F3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
      <span style="font-size: 13px; line-height: 1.45; color: #5E6763">I agree to the <span style="color: #0F4C42; font-weight: 600">Terms</span> and <span style="color: #0F4C42; font-weight: 600">Privacy Policy</span></span>
    </button>

    <a class="rise d5 cta" href="{{ctaHref}}" aria-disabled="{{ctaDisabled}}" style="height: 56px; flex-shrink: 0; border-radius: 28px; background: {{ctaBg}}; color: #F6F6F3; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none">{{ctaLabel}}</a>

    <div class="rise d6" style="margin-top: auto; text-align: center; font-size: 13.5px; color: #5E6763">Already have an account? <a href="Login.dc.html" style="font-weight: 600; text-decoration: none">Log in</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pw: '', agree: false, mode: 'email' };
  }
  renderVals() {
    const { pw, agree, mode } = this.state;
    const email = mode === 'email';
    let score = 0;
    if (pw.length >= 8) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    if (pw.length > 0 && pw.length < 8) score = Math.min(score, 1);
    if (pw.length > 0 && score === 0) score = 1;
    const colors = ['#DDE1DD', '#C8321C', '#C27A1E', '#2FA58A', '#0F4C42'];
    const labels = ['', 'Too weak', 'Okay', 'Strong', 'Excellent'];
    const segs = [0, 1, 2, 3].map((i) => ({ bg: i < score ? colors[score] : '#DDE1DD' }));
    return {
      isEmail: email,
      isPhone: !email,
      segX: email ? '0%' : '100%',
      emailSel: email ? 'true' : 'false',
      phoneSel: email ? 'false' : 'true',
      emailColor: email ? '#111614' : '#5E6763',
      phoneColor: email ? '#5E6763' : '#111614',
      pickEmail: () => this.setState({ mode: 'email' }),
      pickPhone: () => this.setState({ mode: 'phone' }),
      segs,
      strengthLabel: pw.length === 0 ? '' : labels[score],
      strengthColor: score <= 1 ? '#A3281A' : score === 2 ? '#8A4A12' : '#0F4C42',
      onPw: (e) => this.setState({ pw: e.target.value }),
      agreeChecked: agree ? 'true' : 'false',
      boxBg: agree ? '#0F4C42' : '#FFFFFF',
      boxBd: agree ? '#0F4C42' : '#B9C1BD',
      toggleAgree: () => this.setState({ agree: !agree }),
      ctaBg: agree ? '#0F4C42' : '#93AFA8',
      ctaDisabled: agree ? 'false' : 'true',
      ctaLabel: email ? 'Create account' : 'Send code',
      ctaHref: email ? 'Onboard.dc.html' : 'Otp.dc.html'
    };
  }
}
</script>
</body>
</html>
