<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pune Explorer (Deccan) — Forgot password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&amp;family=Yatra+One&amp;family=Mukta:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1F4E}a:hover{color:#5C1239}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popin{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) .1s both}
.swap{animation:swap .45s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:popin .55s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.25s}.d4{animation-delay:.32s}
.rings{animation:spin 90s linear infinite;transform-origin:50% 50%}
.tap{transition:transform .2s cubic-bezier(.2,.7,.2,1),background-color .3s}
.tap:active{transform:scale(.97)}
.field{transition:border-color .3s,box-shadow .3s}
.field:focus-within{border-color:#7A1F4E;box-shadow:0 0 0 3px rgba(122,31,78,.12)}
.cta{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 30px -14px rgba(122,31,78,.7)}
.cta:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #7A1F4E; font-family: 'Mukta', sans-serif; color: #231C17">

  <svg width="390" height="10" viewBox="0 0 390 10" aria-hidden="true" style="position: absolute; top: 0; left: 0; z-index: 5"><defs><pattern id="zz" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#C59A3A"></rect><path d="M0 10 L5 2 L10 10 Z" fill="#5C1239"></path></pattern></defs><rect width="390" height="10" fill="url(#zz)"></rect></svg>
  <div aria-hidden="true" style="position: absolute; right: 54px; top: 118px; width: 58px; height: 58px; border-radius: 29px; background: #E2B95B; opacity: 0.85"></div>
  <svg width="390" height="80" viewBox="0 0 390 96" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 196px; opacity: 0.9"><path d="M0 74 Q60 34 120 58 T240 44 T390 54 V96 H0 Z" fill="#6A1A44"></path><path d="M0 96 V66 H30 V54 a14 14 0 0 1 28 0 V66 H110 V58 H118 V52 H126 V58 H134 V52 H142 V58 H150 V66 H170 V44 a22 22 0 0 1 44 0 V66 H260 V56 a12 12 0 0 1 24 0 V66 H330 V50 a16 16 0 0 1 32 0 V66 H390 V96 Z" fill="#4E0F30"></path></svg>

  <div style="position: absolute; top: 56px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 24px; color: #F3EADB">
    <a class="rise d1 tap" href="DeccanLogin.dc.html" aria-label="Back to log in" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid rgba(255,251,243,0.3); display: flex; align-items: center; justify-content: center">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F3EADB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="rise d2" style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; flex-direction: column"><div style="font-family: 'Yatra One', sans-serif; font-size: 19px; line-height: 1.25; color: #E2B95B">पासवर्ड विसरलात?</div><h1 style="margin: 0; font-family: 'DM Serif Display', serif; font-size: 46px; font-weight: 400; line-height: 0.95">Reset your<br><span style="font-style: italic; color: #F2C9DC">password</span></h1></div>
      <div style="font-size: 14px; color: #F2D5E3">It happens. We'll email you a link to set a new one.</div>
    </div>
  </div>

  <div class="up" style="position: absolute; left: 0; right: 0; top: 268px; bottom: 0; background: #F3EADB; border-radius: 30px 30px 0 0; padding: 30px 24px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">

    <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
      <div class="swap" style="display: flex; flex-direction: column; gap: 16px">
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #6B5D50">EMAIL</span>
          <span class="field" style="height: 50px; border-radius: 14px; border: 1px solid #DCCDB6; background: #FFFBF3; display: flex; align-items: center; padding: 0 16px"><input type="email" placeholder="you@example.com" autocomplete="email" style="border: none; outline: none; flex: 1; min-width: 0; font-family: 'Mukta', sans-serif; font-size: 15px; background: transparent; color: #231C17"></span>
        </label>
        <button class="cta" onClick="{{send}}" style="height: 56px; border-radius: 28px; border: none; background: #7A1F4E; color: #F3EADB; font-family: 'Mukta', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Send reset link</button>
        <div style="font-size: 13px; line-height: 1.45; color: #6B5D50; text-align: center">Signed up with your mobile? <a href="DeccanLogin.dc.html" style="font-weight: 600; text-decoration: none">Log in with a code instead</a></div>
      </div>
    </sc-if>

    <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
      <div class="swap" style="display: flex; flex-direction: column; gap: 18px; align-items: center; text-align: center; padding-top: 8px">
        <div class="pop" style="width: 64px; height: 64px; border-radius: 32px; background: #F5E6EE; display: flex; align-items: center; justify-content: center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7A1F4E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="font-family: 'DM Serif Display', serif; font-size: 28px">Check your inbox</div>
          <div style="font-size: 14px; line-height: 1.5; color: #6B5D50">If there's an account for that email, a reset link is on its way. It works for 30 minutes.</div>
        </div>
        <a class="cta" href="mailto:" style="width: 100%; height: 56px; border-radius: 28px; background: #7A1F4E; color: #F3EADB; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none">Open email app</a>
        <div style="display: flex; gap: 18px; font-size: 13.5px">
          <button class="tap" onClick="{{again}}" style="border: none; background: transparent; padding: 0; font-family: 'Mukta', sans-serif; font-size: 13.5px; font-weight: 600; color: #7A1F4E; cursor: pointer">Send again</button>
          <a href="DeccanLogin.dc.html" style="font-weight: 600; text-decoration: none">Back to log in</a>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false };
  }
  renderVals() {
    const sent = this.state.sent;
    return {
      sent,
      notSent: !sent,
      send: () => this.setState({ sent: true }),
      again: () => this.setState({ sent: false })
    };
  }
}
</script>
</body>
</html>
