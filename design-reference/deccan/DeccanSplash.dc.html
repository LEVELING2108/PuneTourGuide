<style>
body{margin:0}
a{color:#F3EADB}a:hover{color:#FFFBF3}
@keyframes draw{from{stroke-dashoffset:70}to{stroke-dashoffset:0}}
@keyframes needle{0%{transform:rotate(-120deg);opacity:0}60%{transform:rotate(14deg);opacity:1}80%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ring{from{transform:scale(.6);opacity:0}40%{opacity:.25}to{transform:scale(1.6);opacity:0}}
@keyframes breathe{50%{opacity:.45}}
.circle{stroke-dasharray:70;animation:draw 1.2s cubic-bezier(.4,.1,.2,1) .2s both}
.needle{transform-origin:12px 12px;animation:needle 1.3s cubic-bezier(.3,.8,.2,1) .7s both}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.r1{animation-delay:1.2s}.r2{animation-delay:1.45s}.r3{animation-delay:2.2s}
.wave{position:absolute;left:50%;top:50%;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;border:1px solid #F3EADB;animation:ring 3.2s ease-out 1s infinite}
.w2{animation-delay:2.6s}
.hint{animation:rise .8s ease 2.2s both,breathe 2.4s ease-in-out 3s infinite}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
