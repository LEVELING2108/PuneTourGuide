<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pune Explorer (Deccan) — Log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&amp;family=Yatra+One&amp;family=Mukta:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1F4E}a:hover{color:#5C1239}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) .1s both}
.swap{animation:swap .4s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.25s}.d4{animation-delay:.32s}.d5{animation-delay:.39s}.d6{animation-delay:.46s}
.rings{animation:spin 90s linear infinite;transform-origin:50% 50%}
.tap{transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .3s,background-color .3s,color .3s,border-color .3s}
.tap:active{transform:scale(.97)}
.gbtn:hover{border-color:#231C17;box-shadow:0 12px 24px -16px rgba(35,28,23,.45)}
.field{transition:border-color .3s,box-shadow .3s}
.field:focus-within{border-color:#7A1F4E;box-shadow:0 0 0 3px rgba(122,31,78,.12)}
.seg{transition:transform .45s cubic-bezier(.3,.8,.2,1)}
.segtxt{transition:color .35s}
.cta{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 30px -14px rgba(122,31,78,.7)}
.cta:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #7A1F4E; font-family: 'Mukta', sans-serif; color: #231C17">

  <svg width="390" height="10" viewBox="0 0 390 10" aria-hidden="true" style="position: absolute; top: 0; left: 0; z-index: 5"><defs><pattern id="zz" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#C59A3A"></rect><path d="M0 10 L5 2 L10 10 Z" fill="#5C1239"></path></pattern></defs><rect width="390" height="10" fill="url(#zz)"></rect></svg>
  <div aria-hidden="true" style="position: absolute; right: 54px; top: 102px; width: 58px; height: 58px; border-radius: 29px; background: #E2B95B; opacity: 0.85"></div>
  <svg width="390" height="80" viewBox="0 0 390 96" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 180px; opacity: 0.9"><path d="M0 74 Q60 34 120 58 T240 44 T390 54 V96 H0 Z" fill="#6A1A44"></path><path d="M0 96 V66 H30 V54 a14 14 0 0 1 28 0 V66 H110 V58 H118 V52 H126 V58 H134 V52 H142 V58 H150 V66 H170 V44 a22 22 0 0 1 44 0 V66 H260 V56 a12 12 0 0 1 24 0 V66 H330 V50 a16 16 0 0 1 32 0 V66 H390 V96 Z" fill="#4E0F30"></path></svg>

  <div style="position: absolute; top: 60px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 26px; color: #F3EADB">
    <div class="rise d1" style="display: flex; align-items: center; gap: 10px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F3EADB" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
      <span style="font-family: 'DM Serif Display', serif; font-size: 22px">Pune Explorer</span>
    </div>
    <div class="rise d2" style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; flex-direction: column"><div style="font-family: 'Yatra One', sans-serif; font-size: 19px; line-height: 1.25; color: #E2B95B">पुन्हा स्वागत</div><h1 style="margin: 0; font-family: 'DM Serif Display', serif; font-size: 48px; font-weight: 400; line-height: 0.95">Welcome<br><span style="font-style: italic; color: #F2C9DC">back</span></h1></div>
      <div style="font-size: 14px; color: #F2D5E3">Log in to sync your plans, saves and XP.</div>
    </div>
  </div>

  <div class="up" style="position: absolute; left: 0; right: 0; top: 252px; bottom: 0; background: #F3EADB; border-radius: 30px 30px 0 0; padding: 26px 24px 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">

    <a class="rise d3 tap gbtn" href="DeccanHome.dc.html" style="height: 54px; box-sizing: border-box; border-radius: 27px; border: 1px solid #D8C6A6; background: #FFFBF3; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: 'Mukta', sans-serif; font-size: 15px; font-weight: 600; color: #231C17; text-decoration: none">
      <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; border: 1px dashed #B3A28A; box-sizing: border-box; font-size: 7px; color: #6B5D50; display: flex; align-items: center; justify-content: center">LOGO</span>
      Continue with Google</a>

    <div class="rise d3" style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #6B5D50">
      <span style="flex: 1; height: 1px; background: #DCCDB6"></span>or<span style="flex: 1; height: 1px; background: #DCCDB6"></span>
    </div>

    <div class="rise d4" role="tablist" aria-label="Log in with" style="position: relative; height: 44px; border-radius: 22px; background: #E7DAC4; padding: 4px; box-sizing: border-box; display: flex">
      <div class="seg" style="position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: 36px; border-radius: 18px; background: #FFFBF3; box-shadow: 0 2px 8px -2px rgba(35,28,23,0.2); transform: translateX({{segX}})"></div>
      <button class="segtxt" role="tab" aria-selected="{{emailSel}}" onClick="{{pickEmail}}" style="position: relative; flex: 1; border: none; background: transparent; font-family: 'Mukta', sans-serif; font-size: 13.5px; font-weight: 600; color: {{emailColor}}; cursor: pointer">Email</button>
      <button class="segtxt" role="tab" aria-selected="{{phoneSel}}" onClick="{{pickPhone}}" style="position: relative; flex: 1; border: none; background: transparent; font-family: 'Mukta', sans-serif; font-size: 13.5px; font-weight: 600; color: {{phoneColor}}; cursor: pointer">Mobile number</button>
    </div>

    <sc-if value="{{isEmail}}" hint-placeholder-val="{{ true }}">
      <div class="swap" style="display: flex; flex-direction: column; gap: 12px">
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #6B5D50">EMAIL</span>
          <span class="field" style="height: 50px; border-radius: 14px; border: 1px solid #DCCDB6; background: #FFFBF3; display: flex; align-items: center; padding: 0 16px"><input type="email" placeholder="you@example.com" autocomplete="email" style="border: none; outline: none; flex: 1; min-width: 0; font-family: 'Mukta', sans-serif; font-size: 15px; background: transparent; color: #231C17"></span>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="display: flex; justify-content: space-between; align-items: baseline">
            <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #6B5D50">PASSWORD</span>
            <a href="DeccanForgotPassword.dc.html" style="font-size: 12.5px; font-weight: 600; text-decoration: none">Forgot?</a>
          </span>
          <span class="field" style="height: 50px; border-radius: 14px; border: 1px solid #DCCDB6; background: #FFFBF3; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 16px">
            <input type="{{pwType}}" placeholder="Your password" autocomplete="current-password" style="border: none; outline: none; flex: 1; min-width: 0; font-family: 'Mukta', sans-serif; font-size: 15px; background: transparent; color: #231C17">
            <button class="tap" onClick="{{toggleShow}}" aria-label="{{showLabel}}" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <sc-if value="{{hidden}}" hint-placeholder-val="{{ true }}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5D50" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </sc-if>
              <sc-if value="{{shown}}" hint-placeholder-val="{{ false }}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A1F4E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3 3.9M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
              </sc-if>
            </button>
          </span>
        </label>
        <a class="cta" href="DeccanHome.dc.html" style="height: 56px; border-radius: 28px; background: #7A1F4E; color: #F3EADB; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none; margin-top: 4px">Log in</a>
      </div>
    </sc-if>

    <sc-if value="{{isPhone}}" hint-placeholder-val="{{ false }}">
      <div class="swap" style="display: flex; flex-direction: column; gap: 12px">
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #6B5D50">MOBILE NUMBER</span>
          <span class="field" style="height: 50px; border-radius: 14px; border: 1px solid #DCCDB6; background: #FFFBF3; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 6px">
            <span style="height: 38px; padding: 0 10px; border-radius: 10px; background: #EFE4D2; display: flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 600; color: #231C17">IN +91
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6B5D50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span>
            <input type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="98XXX XXXXX" style="border: none; outline: none; flex: 1; min-width: 0; font-family: 'Mukta', sans-serif; font-size: 16px; letter-spacing: 0.04em; background: transparent; color: #231C17">
          </span>
        </label>
        <div style="font-size: 12.5px; line-height: 1.45; color: #6B5D50">We'll text a 6-digit code to this number. New here? The same code creates your account.</div>
        <a class="cta" href="DeccanOtp.dc.html" style="height: 56px; border-radius: 28px; background: #7A1F4E; color: #F3EADB; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none; margin-top: 4px">Send code</a>
      </div>
    </sc-if>

    <div class="rise d6" style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 13.5px; color: #6B5D50">
      <div>New to Pune Explorer? <a href="DeccanSignUp.dc.html" style="font-weight: 600; text-decoration: none">Create account</a></div>
      <a href="DeccanHome.dc.html" style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #6B5D50; text-decoration: none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"></path></svg>
        Skip for now · SOS works without an account</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: false, mode: 'email' };
  }
  renderVals() {
    const { show, mode } = this.state;
    const email = mode === 'email';
    return {
      isEmail: email,
      isPhone: !email,
      segX: email ? '0%' : '100%',
      emailSel: email ? 'true' : 'false',
      phoneSel: email ? 'false' : 'true',
      emailColor: email ? '#231C17' : '#6B5D50',
      phoneColor: email ? '#6B5D50' : '#231C17',
      pickEmail: () => this.setState({ mode: 'email' }),
      pickPhone: () => this.setState({ mode: 'phone' }),
      pwType: show ? 'text' : 'password',
      hidden: !show,
      shown: show,
      showLabel: show ? 'Hide password' : 'Show password',
      toggleShow: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ show: !show }); }
    };
  }
}
</script>
</body>
</html>
