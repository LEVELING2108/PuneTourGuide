<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pune Explorer (Deccan) — Medical info</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&amp;family=Yatra+One&amp;family=Mukta:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1F4E}a:hover{color:#5C1239}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}.d4{animation-delay:.26s}.d5{animation-delay:.33s}.d6{animation-delay:.4s}
.tap{transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .3s,background-color .3s,color .3s,border-color .3s}
.tap:active{transform:scale(.96)}
.field{transition:border-color .3s,box-shadow .3s}
.field:focus-within{border-color:#7A1F4E;box-shadow:0 0 0 3px rgba(122,31,78,.12)}
.knob{transition:left .35s cubic-bezier(.3,.8,.2,1)}
.track{transition:background-color .35s}
.cta{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 30px -14px rgba(122,31,78,.7)}
.cta:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F3EADB; font-family: 'Mukta', sans-serif; color: #231C17; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 18px">
  <svg width="390" height="10" viewBox="0 0 390 10" aria-hidden="true" style="position: absolute; top: 0; left: 0; z-index: 6; pointer-events: none"><defs><pattern id="zz" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#C59A3A"></rect><path d="M0 10 L5 2 L10 10 Z" fill="#5C1239"></path></pattern></defs><rect width="390" height="10" fill="url(#zz)"></rect></svg>

  <div class="rise d1" style="display: flex; align-items: center; justify-content: space-between">
    <a class="tap" href="DeccanSettings.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DCCDB6; background: #FFFBF3; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#231C17" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
  </div>

  <div class="rise d2" style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; flex-direction: column"><div style="font-family: 'Yatra One', sans-serif; font-size: 19px; line-height: 1.25; color: #A4462B">वैद्यकीय माहिती</div><h1 style="margin: 0; font-family: 'DM Serif Display', serif; font-size: 40px; font-weight: 400; line-height: 1">Medical <span style="font-style: italic; color: #7A1F4E">info</span></h1></div>
    <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: #F5E6EE">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A1F4E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      <div style="font-size: 13px; line-height: 1.45; color: #4A1530">Stays on this phone. Shared with responders only while an SOS is active.</div>
    </div>
  </div>

  <div class="rise d3" style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #6B5D50">BLOOD GROUP</div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="8">
        <button class="tap" onClick="{{g.pick}}" aria-pressed="{{g.pressed}}" style="height: 46px; border-radius: 14px; border: 1px solid {{g.bd}}; background: {{g.bg}}; color: {{g.fg}}; font-family: 'DM Serif Display', serif; font-size: 20px; cursor: pointer">{{g.label}}</button>
      </sc-for>
    </div>
  </div>

  <div class="rise d4" style="display: flex; flex-direction: column; gap: 12px">
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #6B5D50">ALLERGIES</span>
      <span class="field" style="height: 48px; border-radius: 14px; border: 1px solid #DCCDB6; background: #FFFBF3; display: flex; align-items: center; padding: 0 16px"><input placeholder="e.g. penicillin, peanuts" style="border: none; outline: none; flex: 1; font-family: 'Mukta', sans-serif; font-size: 15px; background: transparent; color: #231C17"></span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #6B5D50">REGULAR MEDICINES</span>
      <span class="field" style="height: 48px; border-radius: 14px; border: 1px solid #DCCDB6; background: #FFFBF3; display: flex; align-items: center; padding: 0 16px"><input placeholder="Optional" style="border: none; outline: none; flex: 1; font-family: 'Mukta', sans-serif; font-size: 15px; background: transparent; color: #231C17"></span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #6B5D50">NOTES FOR RESPONDERS</span>
      <span class="field" style="height: 48px; border-radius: 14px; border: 1px solid #DCCDB6; background: #FFFBF3; display: flex; align-items: center; padding: 0 16px"><input placeholder="Optional" style="border: none; outline: none; flex: 1; font-family: 'Mukta', sans-serif; font-size: 15px; background: transparent; color: #231C17"></span>
    </label>
  </div>

  <div class="rise d5" style="display: flex; align-items: center; gap: 14px; padding: 4px 0">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 14.5px; font-weight: 600">Show on lock screen</div>
      <div style="font-size: 12.5px; color: #6B5D50">Blood group and contacts, during SOS only</div>
    </div>
    <button onClick="{{toggleLock}}" aria-label="Show on lock screen" aria-pressed="{{lockPressed}}" style="position: relative; width: 52px; height: 32px; border: none; padding: 0; background: transparent; cursor: pointer; flex-shrink: 0">
      <span class="track" style="position: absolute; inset: 0; border-radius: 16px; background: {{lockTrack}}"></span>
      <span class="knob" style="position: absolute; top: 4px; left: {{lockKnob}}; width: 24px; height: 24px; border-radius: 12px; background: #FFFBF3; box-shadow: 0 2px 6px rgba(0,0,0,0.25)"></span></button>
  </div>

  <a class="rise d6 cta" href="DeccanSettings.dc.html" style="margin-top: auto; height: 56px; border-radius: 28px; background: #7A1F4E; color: #F3EADB; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none">Save</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { group: 'O+', lock: true };
  }
  renderVals() {
    const { group, lock } = this.state;
    const groups = ['A+', 'A−', 'B+', 'B−', 'O+', 'O−', 'AB+', 'AB−'].map((label) => {
      const on = label === group;
      return {
        label,
        pressed: on ? 'true' : 'false',
        bg: on ? '#231C17' : '#FFFBF3',
        fg: on ? '#F3EADB' : '#231C17',
        bd: on ? '#231C17' : '#DCCDB6',
        pick: () => this.setState({ group: label })
      };
    });
    return {
      groups,
      lockPressed: lock ? 'true' : 'false',
      lockTrack: lock ? '#7A1F4E' : '#D3C3A8',
      lockKnob: lock ? '24px' : '4px',
      toggleLock: () => this.setState({ lock: !lock })
    };
  }
}
</script>
</body>
</html>
