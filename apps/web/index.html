<!doctype html>
<html lang="en" data-theme="classic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pune Explorer</title>
    <meta name="description" content="A travel guide for Pune where help is always one tap or one shake away, even offline." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F4C42" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pune Explorer" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint (no flash)
      try {
        var t = JSON.parse(localStorage.getItem('pe_theme') || '{}').state;
        if (t && t.theme) document.documentElement.setAttribute('data-theme', t.theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
