<!-- Pune Explorer app icon: Shaniwar Wada (Delhi Darwaza) with the bhagwa, Gilded night.
     Source for every icon size: npm run icons -w apps/web. Keep #bg (background) and #fg (gate) as the two groups: Android draws them as separate layers. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
<radialGradient id="bg" cx="50%" cy="46%" r="70%">
<stop offset="0" stop-color="#3A2A18"/>
<stop offset=".55" stop-color="#17120D"/>
<stop offset="1" stop-color="#0B0A09"/>
</radialGradient>
<radialGradient id="sun" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#FFB547" stop-opacity=".55"/>
<stop offset=".6" stop-color="#E8862A" stop-opacity=".16"/>
<stop offset="1" stop-color="#E8862A" stop-opacity="0"/>
</radialGradient>
<linearGradient id="gateFill" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFE48A"/>
<stop offset=".45" stop-color="#F2C14E"/>
<stop offset="1" stop-color="#B9822A"/>
</linearGradient>
<linearGradient id="doorFill" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2A1A0E"/>
<stop offset="1" stop-color="#120B06"/>
</linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFF3C4"/>
<stop offset="1" stop-color="#FFB13B"/>
</linearGradient>
<linearGradient id="flagFill" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FFA552"/>
<stop offset="1" stop-color="#F0602A"/>
</linearGradient>
</defs>
