services:
  - type: web
    name: pune-explorer-safety
    env: python
    rootDir: services/safety
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT main:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: REDIS_URL
        sync: false
