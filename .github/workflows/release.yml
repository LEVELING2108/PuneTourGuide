name: Release

# Builds the production images and publishes them to GitHub Container Registry, then (when
# DEPLOY_ENABLED) updates the server to that version.
#   research (work in progress, merged through pull requests) -> images tagged :research
#   main     (finished work)                                  -> images tagged :latest
# The server runs whichever branch was released last. Setup: docs/LAUNCH_SETUP.md section 0.

on:
  push:
    branches: [main, research]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/pune-explorer-app
  SAFETY_IMAGE: ghcr.io/${{ github.repository_owner }}/pune-explorer-safety

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names (registry paths must be lower case) and channel tag
        run: |
          echo "APP_IMAGE=${APP_IMAGE,,}" >> "$GITHUB_ENV"
          echo "SAFETY_IMAGE=${SAFETY_IMAGE,,}" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then echo "CHANNEL=latest" >> "$GITHUB_ENV"; else echo "CHANNEL=research" >> "$GITHUB_ENV"; fi

      # VITE_* values are public (they end up in the browser); they come from repository Variables.
      # build-push-action mis-splits a multi-line build-args list (an empty value, a quote or a stray
      # line break makes one setting swallow the next ones), so the settings travel as ONE base64 line
      # that the Dockerfile decodes into apps/web/.env.production.local. HTML (the map credit) stays
      # out: the app derives the credit itself.
      - name: Build settings (only the ones that are set)
        id: args
        env:
          VITE_MAP_TILE_URL: ${{ vars.VITE_MAP_TILE_URL }}
          VITE_MAP_TILES_OFFLINE: ${{ vars.VITE_MAP_TILES_OFFLINE }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_SERVER_SMS: ${{ vars.VITE_SERVER_SMS }}
          VITE_RELEASE: ${{ github.sha }}
        run: |
          file=""
          for k in VITE_MAP_TILE_URL VITE_MAP_TILES_OFFLINE VITE_GOOGLE_CLIENT_ID VITE_SENTRY_DSN VITE_CONTACT_EMAIL VITE_SERVER_SMS VITE_RELEASE; do
            # Trim spaces and line breaks pasted around a value
            v="$(printf '%s' "${!k}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -z "$v" ]; then echo "$k: not set"; continue; fi
            case "$v" in *$'\n'*|*$'\r'*) echo "::error::$k has a line break inside it; fix the repository Variable"; exit 1;; esac
            case "$v" in *'"'*|*'$'*) echo "::error::$k contains \" or \$, which the build cannot pass on"; exit 1;; esac
            echo "$k: set (${#v} characters)"
            file+="$k=$v"$'\n'
          done
          echo "settings=$(printf '%s' "$file" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: App (web + Tour API)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ env.CHANNEL }},${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          build-args: VITE_SETTINGS_B64=${{ steps.args.outputs.settings }}

      # Catch a setting that didn't make it into the website before anyone gets a broken build
      - name: Check the website got its settings
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
        run: |
          img="${APP_IMAGE}:${{ github.sha }}"
          for k in VITE_GOOGLE_CLIENT_ID VITE_CONTACT_EMAIL; do
            v="$(printf '%s' "${!k}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$v" ] && continue
            # The value must appear exactly, followed by a closing quote (not glued to another setting)
            if docker run --rm --entrypoint sh -e P1="${v}\"" -e P2="${v}\`" -e P3="${v}'" "$img" -c 'grep -rqF -e "$P1" -e "$P2" -e "$P3" /repo/apps/web/dist/assets'; then
              echo "$k: in the website"
            else
              echo "::error::$k is missing or garbled in the built website"; exit 1
            fi
          done

      - name: Safety service
        uses: docker/build-push-action@v6
        with:
          context: services/safety
          platforms: linux/amd64
          push: true
          tags: ${{ env.SAFETY_IMAGE }}:${{ env.CHANNEL }},${{ env.SAFETY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=safety
          cache-to: type=gha,mode=max,scope=safety

  deploy:
    needs: images
    runs-on: ubuntu-latest
    # Only once the server exists: set the repository Variable DEPLOY_ENABLED=true (and the DEPLOY_* secrets)
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Update the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/pune-explorer
            # Run exactly the images this workflow just built (research or main)
            sed -i "s/^RELEASE=.*/RELEASE=${{ github.sha }}/" .env.production
            sed -i -E "s#^APP_IMAGE=([^:]+):.*#APP_IMAGE=\1:${{ github.sha }}#; s#^SAFETY_IMAGE=([^:]+):.*#SAFETY_IMAGE=\1:${{ github.sha }}#" .env.production
            docker compose --env-file .env.production pull
            docker compose --env-file .env.production up -d --remove-orphans
            docker image prune -f
            # Wait for the new version to answer (asked inside the container: port 80 only redirects to HTTPS)
            for i in $(seq 1 30); do
              docker compose --env-file .env.production exec -T app node -e "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" && exit 0
              sleep 5
            done
            echo "The app did not become ready" >&2
            docker compose --env-file .env.production logs --tail 50 app
            exit 1
