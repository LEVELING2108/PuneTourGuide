name: CI

on:
  push:
  pull_request:

jobs:
  # main only ever takes research (CLAUDE.md, "Branches and deploys"). Required on main by the
  # GitHub ruleset; branch names arrive through env, never pasted into the script.
  main-from-research:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Pull requests into main come from research
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = main ] && [ "$HEAD" != research ]; then
            echo "::error::Pull requests into main must come from research (this one is from $HEAD). Merge it into research first."
            exit 1
          fi
          echo "ok: $HEAD -> $BASE"

  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pune_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/pune_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:api
      - run: npm run build

  safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/safety
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  # The production image (web + API) must keep building; nothing is pushed from CI yet.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VITE_RELEASE=${{ github.sha }}
