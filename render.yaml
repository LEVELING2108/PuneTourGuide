# Render Blueprint (TECH_DESIGN §12): New → Blueprint → pick this repo.
# Values marked `sync: false` are asked for in the dashboard. See docs/LAUNCH_SETUP.md, "Deploy".
#
# Render gives the app and the safety service separate hostnames, so the safety service's URL is
# set in VITE_SAFETY_URL (web build) and SAFETY_PUBLIC_URL (Content-Security-Policy).
# Free instances sleep when idle: use a paid plan for anything people rely on (SOS alerts).

databases:
  - name: pune-explorer-db
    databaseName: pune_explorer
    plan: basic-256mb
    # PostGIS is enabled by the first migration (CREATE EXTENSION postgis)

services:
  # Web app + Tour API on one origin (root Dockerfile)
  - type: web
    name: pune-explorer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/v1/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: pune-explorer-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: pune-explorer-redis, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: MEDICAL_ENC_KEY # 64 hex characters; generate locally and BACK IT UP (step 4)
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SAFETY_SERVICE_URL
        sync: false
      - key: SAFETY_PUBLIC_URL
        sync: false
      - key: VITE_SAFETY_URL
        sync: false
      - key: VITE_MAP_TILE_URL
        sync: false
      - key: VITE_MAP_TILE_ATTRIBUTION
        sync: false
      - key: MAP_TILE_ORIGINS
        sync: false
      - key: OSRM_URL
        sync: false
      - key: OSRM_FOOT_URL
        sync: false
      - key: SMS_PROVIDER
        value: msg91
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: MSG91_TEMPLATE_SOS
        sync: false
      - key: MSG91_TEMPLATE_SAFE
        sync: false
      - key: MSG91_TEMPLATE_TRIP
        sync: false
      - key: MSG91_TEMPLATE_TEST
        sync: false
      - key: MSG91_TEMPLATE_OTP
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: OVERPASS_ENDPOINTS
        sync: false

  # Safety service (FastAPI): live tracking WebSockets, help fallback
  - type: web
    name: pune-explorer-safety
    runtime: python
    rootDir: services/safety
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --forwarded-allow-ips '*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: REDIS_URL
        fromService: { type: keyvalue, name: pune-explorer-redis, property: connectionString }
      - key: ALLOWED_ORIGINS # the app's URL, e.g. https://pune-explorer.onrender.com
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: OVERPASS_ENDPOINTS
        sync: false

  # Shared Redis: rate limits, caches, SMS queue, live tracking. noeviction so queued SOS texts are never dropped.
  - type: keyvalue
    name: pune-explorer-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: [] # only Render services in this account can connect

  # Nightly help-point import from OpenStreetMap, 03:00 IST (step 6)
  - type: cron
    name: pune-explorer-refresh-help
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "30 21 * * *"
    dockerCommand: node dist/scripts/refresh-help.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: pune-explorer-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: pune-explorer-redis, property: connectionString }
      - key: JWT_SECRET
        fromService: { type: web, name: pune-explorer, envVarKey: JWT_SECRET }
      - key: MEDICAL_ENC_KEY
        fromService: { type: web, name: pune-explorer, envVarKey: MEDICAL_ENC_KEY }
      - key: OVERPASS_ENDPOINTS
        sync: false
